# Publish astryx to PyPI when a version tag (v*) is pushed. PyPI Trusted Publishing: no token is
# stored anywhere; PyPI trusts this workflow in this repo, and the release carries a provenance
# attestation naming it. That provenance is what lets install.sh trust a PyPI package later (a2 #51669 B2).
# One-time setup on pypi.org (owner): add a pending publisher for project "astryx", owner Umair444,
# repository astryx, workflow publish.yml, environment pypi-release.
name: publish
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag matches the package version
        run: |
          v=$(python -c "exec(open('src/astryx/_version.py').read()); print(__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$v"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
