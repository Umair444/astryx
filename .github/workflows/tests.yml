# Standing enforcement of the code invariants: runs devtools/check.sh on GitHub's runners, the off-machine twin of
# the pre-push pushed_tree_check, on every push and PR (seed 10-15; the first manual runs read 0 FAILED, 74 verified
# bare). The runner has no postgres and no gitignored estate, so those gates read amber by design.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
# The job only reads the repo; the token's default scope follows a repo setting, so this file pins it (steward #55551).
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      # full history: test_workflow L1 and the census arms that name a commit measure main itself (seed, CI red 10-16..19)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Requirement lines go to pip as written (-r /dev/stdin, never xargs: a ';' marker or a quote would be split).
      # Derived from src/astryx/data/deps.conf through the BUILD's own reader (hatch_build.deps_groups, which also
      # drops the non-installable on-chip marker), so CI and the wheel can't disagree on what a dependency is. A plain
      # install, never `pip install -e .`: an installed astryx would shadow the tree under test (the identity gate
      # refuses it). `media` is skipped: whisper/onnx are heavy and its gates need a device.
      - name: dependencies (deps.conf via hatch_build, every group but media)
        run: |
          python -m pip install --quiet hatchling
          python -c "import hatch_build as h, pathlib; print('\n'.join(s for g, v in h.deps_groups(pathlib.Path('.')).items() if g != 'media' for s in v))" \
            | python -m pip install --quiet -r /dev/stdin
      # CHECK_ALLOW_SKIP is the VISIBLE exemption, and this is the one place it belongs. check.sh is strict by
      # default: a gate that verifies nothing is RED. A CI clone is the one environment where skipping is
      # legitimate (triggers/, memory/ and the database are absent by construction), so those read amber; check.sh
      # still NAMES every unverified gate and never prints ALL CODE INVARIANTS PASS. Read that list.
      # Under env -i (seed #61038, forge #61043): the org census judges OUR process environment, and the runner's own
      # names (ACTIONS_*, ANDROID_*, …) are a vendor's, never classed to fit. HOME, PATH (setup-python's python3), USER
      # (dsn_census reads it) and LANG are host names the fixtures already keep (org_home_fixture.HOST_KEEP).
      - run: env -i HOME="$HOME" PATH="$PATH" USER="${USER:-runner}" LANG=C.UTF-8 CHECK_ALLOW_SKIP=1 PY=python3 bash devtools/check.sh
