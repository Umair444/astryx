<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>growbot: the org's embodied creature</title>

  <!-- Filled circular base -->
  <circle cx="64" cy="64" r="62" fill="#2c3e50"/>

  <!-- Spine center (pico core) -->
  <circle cx="64" cy="48" r="6" fill="#ecf0f1"/>

  <!-- Left leg: bold sweep down-forward -->
  <line x1="64" y1="48" x2="40" y2="95" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
  <circle cx="40" cy="95" r="5" fill="#f39c12"/>

  <!-- Right leg: bold sweep down-back -->
  <line x1="64" y1="48" x2="88" y2="95" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="88" cy="95" r="5" fill="#e74c3c"/>

  <!-- Motion arc: suggests intentional movement -->
  <path d="M 35 80 Q 64 35, 93 80" stroke="#ecf0f1" stroke-width="3" fill="none" stroke-dasharray="3,3" opacity="0.6"/>
</svg>