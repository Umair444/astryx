# astryx runners — the per-agent RUNNER authority (plan-17).
#
# A "runner" is a periodic poller that lands a low-latency WAKE for one agent —
# work the pulse must never carry in its critical path (e.g. an IMAP fetch that
# could hang the org clock). Each runner becomes ONE systemd oneshot service +
# ONE timer, generated by init.sh; doctor reconciles the enabled set against
# these lines (bidirectional — an undeclared poller and a decl with no unit both
# flag). A runner FEEDS an agent but is org infra, not agent behaviour, so it is
# declared HERE — in an owner-authored manifest — never in the (agent-mutable)
# charter, whose self-edits would race a hand-added line.
#
# This .example.conf ships empty; copy it to runners.conf (gitignored, per-org)
# and add one line per runner. A per-agent runner whose agent is not in the roster
# generates no unit and is flagged by doctor. Format (pipe-delimited):
#
#   <unit-stem> | <agent> | <OnCalendar> | <exec path from repo root> | <description>
#
#   <agent>  a roster agent name (the runner feeds it, gated on it resolving), OR
#            "org" for ORG-INFRA that feeds no single agent (backup, etc.) — always
#            generated, no per-agent gate.
#   <exec>   a .py runs under venv python; a .sh runs directly (executable + shebang).
#
# Examples (the shape; real lines live in runners.conf):
#   canopus-inbound | canopus | *-*-* *:*/2:00 | nucleus/canopus_inbound.py | recruiter-inbound poller — low-latency mail wake, decoupled from the pulse
#   backup          | org     | *-*-* 04:00:00 | nucleus/backup.sh           | postgres dump of the org's whole state; personal-tier (gitignored)
