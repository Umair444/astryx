# astryx Python dependency manifest — the ONE authority (plan-19). install derives
# from it, doctor asserts from it; there is no second hand-maintained list to drift.
# Line:  <group> | <pip-spec> | <import-root>
#   pip-spec  = what `pip install` gets (may carry extras/rename)
#   import-root = the top-level module name (what `import X` uses; often differs)
# Groups: `core` is always installed; an optional group installs only when its gating
# capability is present (see init.sh dep_groups) — media when any channel routes voice,
# keyed on the SAME channels/grants authority the units-generator uses.

# ── core — every org, always ────────────────────────────────────────────────
core  | psycopg[binary]    | psycopg
core  | fastapi            | fastapi
core  | uvicorn[standard]  | uvicorn
core  | asyncpg            | asyncpg
core  | croniter           | croniter
core  | requests           | requests
core  | pynacl             | nacl
# JCS (RFC 8785) — used ONLY by the card verifier, never by the gateway that signs.
# A verifier that re-derives with the producer's own function proves conformance-to-self;
# this is third-party (Trail of Bits, Apache-2.0, pure-python, no runtime deps) so the
# A2A card's signature is re-canonicalised by code neither the signer nor we wrote.
core  | rfc8785            | rfc8785
core  | httpx              | httpx
core  | psutil             | psutil
core  | pydantic           | pydantic

# ── dev — NEVER installed by init (active_dep_groups returns core[+media] only), never
#    checked by doctor. Declared solely so `deps.py coverage` stays honest: the one
#    authority says every third-party import in the repo is declared SOMEWHERE, and
#    punching an exemption into the checker would be worse than naming the import.
# PyYAML is deliberately NOT a runtime dependency — nucleus/okf.py is hand-rolled because
# its strictness IS the frontmatter lint (a general YAML loader would accept an estate
# that slowly grows nesting). It appears only in nucleus/test_okf.py, which cross-checks
# our parse against yaml.safe_load WHEN PyYAML happens to be importable, and skips that
# arm otherwise. Conformance to the SPEC rather than to ourselves — the same reason the
# A2A card verifier uses third-party rfc8785 rather than the signer's own canonicaliser.
# It earned itself on run one: it caught that bare `timestamp: 2026-08-12` is a
# datetime.date to PyYAML and a str to us, so render() now quotes YAML-typed scalars.
dev   | PyYAML             | yaml

# ── media — in-process audio decode + transcription (PyAV wheel bundles libav, so
#    there is NO ffmpeg CLI on PATH: 0-ffmpeg by ABSENCE). Installed when a channel
#    that can carry voice is present. faster-whisper pulls av; av is declared too so
#    the doctor's real-decode probe and import-check name it first-class.
media | av                 | av
media | faster-whisper     | faster_whisper
