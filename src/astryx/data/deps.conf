# astryx Python dependency manifest — the ONE authority (plan-19). install derives
# from it, doctor asserts from it; there is no second hand-maintained list to drift.
# Line:  <group> | <pip-spec> | <import-root>
#   pip-spec  = what `pip install` gets (may carry extras/rename)
#   import-root = the top-level module name (what `import X` uses; often differs)
# Groups: `core` is always installed; an optional group installs only when its gating
# capability is present (see init.sh dep_groups) — media when any channel routes voice,
# keyed on the SAME channels/grants authority the units-generator uses.

# ── core — every org, always ────────────────────────────────────────────────
core  | psycopg[binary]    | psycopg
core  | fastapi            | fastapi
core  | uvicorn[standard]  | uvicorn
core  | asyncpg            | asyncpg
core  | croniter           | croniter
core  | requests           | requests
core  | pynacl             | nacl
# JCS (RFC 8785) — used ONLY by the card verifier, never by the gateway that signs.
# A verifier that re-derives with the producer's own function proves conformance-to-self;
# this is third-party (Trail of Bits, Apache-2.0, pure-python, no runtime deps) so the
# A2A card's signature is re-canonicalised by code neither the signer nor we wrote.
core  | rfc8785            | rfc8785
core  | httpx              | httpx
# pyserial — the growbot body host's wire to the Pico (src/astryx/contrib/growbot_body.py).
# Core, not an optional group: pure-python, tiny, and the host runs a VIRTUAL body
# (serial:false) when no chip is plugged — the import must succeed everywhere.
core  | pyserial           | serial
core  | psutil             | psutil
core  | pydantic           | pydantic
# mcp — the MCP SDK every mcp/<server>/server.py imports (plan-10224 S0b). It was missing, so a fresh
# install had no SDK; the repo's own mcp/ directory made the coverage check read it as first-party.
# Capped below 2: mcp 2.x removed mcp.server.fastmcp (FastMCP was renamed MCPServer), which every mcp/<server>/server.py
# imports, so an unpinned fresh install (pip install astryx, CI) got MCP servers that cannot start (seed 10-15, CI run
# 38671958004: 5 gates RED). Lift the cap only with the port to the 2.x API.
core  | mcp>=1.28,<2       | mcp

# ── cli — the `astryx` command's terminal output (src/astryx/ui.py). A pip install always has it
#    (pyproject derives dependencies from core + cli); init never installs it into the org's venv and
#    doctor never asserts it, because the CLI degrades to plain text without it.
cli   | rich               | rich

# ── discord — the Discord bridge (bridges/discord.py). Installed when bridges/routes-discord.json
#    exists, the same channel authority the units-generator gates astryx-discord.service on.
discord | discord.py       | discord

# ── dev — NEVER installed by init (active_dep_groups returns core[+media] only), never
#    checked by doctor. Declared solely so `deps.py coverage` stays honest: the one
#    authority says every third-party import in the repo is declared SOMEWHERE, and
#    punching an exemption into the checker would be worse than naming the import.
# PyYAML is deliberately NOT a runtime dependency — src/astryx/memory/okf.py is hand-rolled because
# its strictness IS the frontmatter lint (a general YAML loader would accept an estate
# that slowly grows nesting). It appears only in tests/test_okf.py, which cross-checks
# our parse against yaml.safe_load WHEN PyYAML happens to be importable, and skips that
# arm otherwise. Conformance to the SPEC rather than to ourselves — the same reason the
# A2A card verifier uses third-party rfc8785 rather than the signer's own canonicaliser.
# It earned itself on run one: it caught that bare `timestamp: 2026-08-12` is a
# datetime.date to PyYAML and a str to us, so render() now quotes YAML-typed scalars.
dev   | PyYAML             | yaml
# pyflakes — undefined-name analysis over triggers/*/*.py (tests/test_trigger_smoke.py).
# Earned 2026-08-14: three agents edited one trigger file in two hours, a helper was
# dropped while another author's function still called it, and every per-proposal oracle
# stayed green because each tests its own function against its own staged copy. Static,
# because the runtime version of this gate both MISSED that bug (stubbed queries return
# empty, so the calling line is never reached) and reddened on correct code.
dev   | pyflakes           | pyflakes
# machine — MicroPython's hardware API, imported ONLY by src/astryx/contrib/growbot_firmware.py,
# which never runs on the host: mpremote copies it onto the Pico as main.py and the
# chip's own interpreter provides `machine`. There is no pip-spec that could install
# it; the spec below is a non-installable marker (dev group is never installed).
dev   | micropython-onchip | machine
# Pillow — OPTIONAL cross-check in tests/test_canvas_preview.py: when importable, the stdlib PNG
# reader that the containment arm uses is pinned against Pillow's pixels. The arm itself needs no
# image library. Test-only, never installed by init.
dev   | Pillow             | PIL
dev   | websockets         | websockets
# hatchling — imported only by hatch_build.py, the wheel/sdist build hooks (pip pulls it as the build backend).
dev   | hatchling          | hatchling

# ── media — in-process audio decode + transcription (PyAV wheel bundles libav, so
#    there is NO ffmpeg CLI on PATH: 0-ffmpeg by ABSENCE). Installed when a channel
#    that can carry voice is present. faster-whisper pulls av; av is declared too so
#    the doctor's real-decode probe and import-check name it first-class.
media | av                 | av
media | faster-whisper     | faster_whisper
# sherpa-onnx — the Room's voiceprints: CAM++ speaker embeddings on CPU (src/astryx/hearing/voiceprint.py)
media | sherpa-onnx==1.13.8 | sherpa_onnx
# sentencepiece — the Room's wake word spells agent names into the keyword spotter's tokens (src/astryx/hearing/wake.py)
media | sentencepiece==0.2.2 | sentencepiece
# numpy — the ear (bridges/ear.py, ear_stt.py) decodes PCM into the array faster-whisper takes; faster-whisper
#   already pulls it, declared so the import check names it.
media | numpy              | numpy
