# plan-7862 S1 per-lease proxy. Default deny; the allow-list is the lease's own, generated by
# src/astryx/hands/hands.py and mounted at /etc/tinyproxy/filter. CONNECT only to 443 (no plaintext
# tunnels). Every request, including the denied ones, is logged at Connect level.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 120
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off
ConnectPort 443
LogLevel Connect
