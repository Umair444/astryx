User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
# default-deny: only hosts matching /etc/tinyproxy/filter are allowed; all else denied.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off
# HTTPS CONNECT only to 443 — the SNI/host allow-list is applied to the CONNECT target
# host WITHOUT terminating TLS (no interception).
ConnectPort 443
# Connect-level logging so every allowed AND denied CONNECT is on the record (the
# denied-attempt log is the arbitrary-host-exfil detector). Logs to stdout.
LogLevel Connect
